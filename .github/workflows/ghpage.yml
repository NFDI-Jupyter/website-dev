name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  # Periodic rebuild to pick up documentation changes from NFDI-Jupyter/services
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: latest

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

      # Build the MkDocs documentation from NFDI-Jupyter/services into dist/docs
      # so it is served under https://nfdi-jupyter.de/docs/
      - name: Checkout docs
        uses: actions/checkout@v6
        with:
          repository: NFDI-Jupyter/services
          path: services

      - name: Build docs into dist/docs
        working-directory: services
        env:
          DISABLE_MKDOCS_2_WARNING: "true"
        run: |
          pip install mkdocs-material mkdocs-gen-files mkdocs-macros-plugin mkdocs-jupyter mkdocs-simple-hooks neoteroi-mkdocs
          mkdocs build -d ../dist/docs

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
